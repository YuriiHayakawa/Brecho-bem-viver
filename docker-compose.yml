services:
  db:
    image: postgres:16-alpine
    container_name: brecho_bem_viver_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: brecho_bem_viver
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d brecho_bem_viver"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
